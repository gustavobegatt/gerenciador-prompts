<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo projeto — Gerenciador de Prompts</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>try { document.documentElement.dataset.tema = localStorage.getItem("tema") === "claro" ? "claro" : "escuro"; } catch (e) {}</script>
</head>
<body>
  <div class="app">
    <aside class="menu-lateral">
      <a href="../index.html" class="menu-logo"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 006.2 21h11.6a2 2 0 001.7-2.8L14 9V3"/><path d="M7.5 15h9"/></svg><span>PromptLab</span></a>
      <nav class="menu-nav" aria-label="Menu principal">
        <a href="../index.html" class="menu-item ativo" aria-current="page"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Início</span></a>
        <a href="calendario.html" class="menu-item"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendário</span></a>
        <a href="prompts.html" class="menu-item"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Prompts</span></a>
      </nav>
    </aside>

    <div class="area">
      <main>
        <nav class="migalhas" aria-label="Você está em">
          <a href="../index.html">Início</a> &gt; <span id="migalha-atual">Novo projeto</span>
        </nav>

        <form class="formulario" id="form-projeto" novalidate>
          <h1 id="titulo-pagina">Novo projeto</h1>

          <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" maxlength="100" placeholder="Ex.: Chatbot de Atendimento" required>
          </div>

          <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" maxlength="255" placeholder="Para que serve este projeto?" style="min-height:110px"></textarea>
            <div class="campo__ajuda"><span></span><span id="contador">0/255</span></div>
          </div>

          <div class="campo">
            <label for="status">Status</label>
            <select id="status">
              <option value="ativo">Ativo</option>
              <option value="concluido">Concluído</option>
            </select>
          </div>

          <div class="formulario__acoes">
            <a href="../index.html" class="btn" id="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn btn--primario" id="btn-salvar">Salvar</button>
          </div>
          <p class="nota">* campos obrigatórios</p>
        </form>
      </main>

      <footer class="rodape">
        Rodapé — © 2026 Gerenciador de Prompts
      </footer>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/projeto-form.js"></script>
</body>
</html>
