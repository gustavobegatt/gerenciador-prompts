<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo prompt — Gerenciador de Prompts</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>try { document.documentElement.dataset.tema = localStorage.getItem("tema") === "claro" ? "claro" : "escuro"; } catch (e) {}</script>
</head>
<body>
  <div class="app">
    <aside class="menu-lateral">
      <a href="../index.html" class="menu-logo"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.2A2 2 0 006.2 21h11.6a2 2 0 001.7-2.8L14 9V3"/><path d="M7.5 15h9"/></svg><span>PromptLab</span></a>
      <nav class="menu-nav" aria-label="Menu principal">
        <a href="../index.html" class="menu-item"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Início</span></a>
        <a href="calendario.html" class="menu-item"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendário</span></a>
        <a href="prompts.html" class="menu-item ativo" aria-current="page"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Prompts</span></a>
      </nav>
    </aside>

    <div class="area">
      <main>
        <nav class="migalhas" aria-label="Você está em">
          <a href="prompts.html">Prompts</a> &gt; <span id="migalha-atual">Novo prompt</span>
        </nav>

        <form class="formulario" id="form-prompt" novalidate>
          <h1 id="titulo-pagina">Novo prompt</h1>

          <div class="campo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" maxlength="150" placeholder="Ex.: Resumir texto" required>
          </div>

          <div class="campo">
            <label for="texto">Texto do prompt *</label>
            <textarea id="texto" maxlength="1000" placeholder="Digite o prompt aqui..." required></textarea>
            <div class="campo__ajuda"><span>Use {variavel} para partes que mudam.</span><span id="contador">0/1000</span></div>
          </div>

          <div class="campo" id="grupo-projeto">
            <label for="projeto">Usar em um projeto (opcional)</label>
            <select id="projeto">
              <option value="">Selecione um projeto</option>
            </select>
          </div>

          <div class="formulario__acoes">
            <a href="prompts.html" class="btn">Cancelar</a>
            <button type="submit" class="btn btn--primario" id="btn-salvar">Salvar</button>
          </div>
          <p class="nota">* campos obrigatórios</p>
        </form>
      </main>

      <footer class="rodape">
        Rodapé — © 2026 Gerenciador de Prompts
      </footer>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/prompt-form.js"></script>
</body>
</html>
